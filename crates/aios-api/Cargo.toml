[package]
name = "aios-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aios-types.workspace = true
aios-core.workspace = true
aios-caps.workspace = true
aios-runs.workspace = true
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower-http = { version = "0.7.0", features = ["trace"] }
futures-core = "0.3.34"
time = "0.3.55"
async-stream = "0.3.6"
